# Production : Docker rootless sous l'utilisateur « amimoucheur », dans /srv/amimoucheur
# (code dans ./site). En rootless, les ports publiés restent soumis à UFW.
volumes:
  db-data:
  caddy-data:
  caddy-config:

services:
  mysql:
    image: mysql:5.6
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    mem_limit: 400m
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql-lowmem.cnf:/etc/mysql/conf.d/lowmem.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: amimoucheur
      TZ: 'America/Toronto'

  apache:
    build: .
    image: amimoucheur-php56
    restart: unless-stopped
    depends_on:
      - mysql
    mem_limit: 700m
    volumes:
      - ./site:/var/www/html
      - ./msmtprc:/etc/msmtprc:ro

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - apache
    # Derrière le Caddy d'entrée du serveur, qui seul écoute sur 80/443
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proto:/srv/proto:ro
      - caddy-data:/data
      - caddy-config:/config

  # Accès à proto.amimoucheur.com par code envoyé par courriel (voir proto-auth.py)
  proto-auth:
    image: python:3.12.7-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: python -u /app/proto-auth.py
    volumes:
      - ./proto-auth.py:/app/proto-auth.py:ro
      - ./proto-auth:/data
      - ./msmtprc:/etc/msmtprc:ro
