ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName www.amimoucheur.com
    ServerAlias amimoucheur.com
    DocumentRoot /var/www/html

    LimitRequestBody 33554432

    # Vraie IP client (Cloudflare -> Caddy -> Apache)
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 172.16.0.0/12
    # TLS terminé par Caddy : PrestaShop doit voir HTTPS=on
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # php2shell : bloque tout POST multipart/form-data hors back-office,
    # avant que PHP ne parse la requête.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/admin0181/
    RewriteCond %{HTTP:Content-Type} multipart/form-data [NC]
    RewriteRule ^ - [F]

    # Aucun PHP exécutable dans les dossiers inscriptibles
    <DirectoryMatch "^/var/www/html/(img|upload|download|cache|log)/">
        php_admin_flag engine off
    </DirectoryMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
