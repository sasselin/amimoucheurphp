; Atténuations php2shell (CVE-2026-109618 / CVE-2026-109619)
session.upload_progress.enabled = 0
; Le paquet Sury 5.6.40-105 contient le correctif : memory_limit = -1 n'est plus
; nécessaire (il ouvrait un risque de DoS mémoire).
memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 30M

; Durcissement général
expose_php = Off
display_errors = Off
log_errors = On
session.use_strict_mode = 1
session.cookie_httponly = 1
allow_url_include = Off
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec

; PrestaShop
date.timezone = America/Toronto
max_input_vars = 10000
max_execution_time = 120

; Envoi des courriels : mail() -> msmtp -> Brevo (STARTTLS, port 2525).
; SwiftMailer 3 de PrestaShop 1.6 ne gère pas STARTTLS, et DigitalOcean bloque 465/587.
sendmail_path = "/usr/bin/msmtp -t -i"
