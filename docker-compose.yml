
volumes:
    db-data:

services:
  mysql:
    image: mysql:5.6
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: amimoucheur
      TZ: 'America/Toronto'

  apache:
    image: prestashop/base:5.6-apache
    # environment:
    #   # DB_NAME: amimoucheur
    #   # DB_USER: root
    #   # DB_PASSWD: ""
    #   # DB_PREFIX: ps_
    #   # DB_SERVER: mysql
    #   # PS_DOMAIN: localhost:8001
    #   # PS_FOLDER_ADMIN: admin0181
    ports:
      - "80:80"
    volumes:
      - ./site:/var/www/html
      # Même emplacement qu'en prod (site/export-catalogue/) pour export-catalogue/run.sh
      - ./export-catalogue:/var/www/html/export-catalogue:ro
