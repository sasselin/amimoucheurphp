
version: '3.8'

volumes:
    db-data:

services:
  mysql:
    image: mysql:5.6
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: amimoucheur
      TZ: 'America/Toronto'

  apache:
    image: prestashop/base:5.6-apache
    # environment:
    #   # DB_NAME: amimoucheur
    #   # DB_USER: root
    #   # DB_PASSWD: ""
    #   # DB_PREFIX: ps_
    #   # DB_SERVER: mysql
    #   # PS_DOMAIN: localhost:8001
    #   # PS_FOLDER_ADMIN: admin0181
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html